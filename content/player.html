<!DOCTYPE html>
<html>
<head>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v');

    if (videoId) {
      const iframe = document.createElement('iframe');
      // Use standard youtube.com domain, the extension origin will be the referrer
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1&rel=0&playsinline=1`;
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
