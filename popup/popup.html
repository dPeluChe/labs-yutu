<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yutu Labs - Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 8.64L15.27 12 10 15.36V8.64M8 5v14l11-7L8 5z"/>
        </svg>
        <h1>Yutu Labs</h1>
      </div>
      <p class="subtitle">Floating window settings</p>
    </header>

    <section class="settings-section">
      <h2>Hide elements in window</h2>
      <p class="help-text">Settings only apply to <strong>floating windows</strong> (when clicking "Open"). Does not affect your normal YouTube view.</p>

      <div class="toggle-group">
        <label class="toggle-label">
          <input type="checkbox" id="hide-reels" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Reels / Shorts</span>
            <span class="toggle-description">Hide short videos section</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-sidebar" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Related videos</span>
            <span class="toggle-description">Hide recommendations sidebar</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-description" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Description</span>
            <span class="toggle-description">Hide video description</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-header" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Header</span>
            <span class="toggle-description">Hide top navigation bar</span>
          </div>
        </label>
      </div>
    </section>

    <footer>
      <button id="save-btn" class="btn-primary">Save changes</button>
      <div id="save-status" class="save-status"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
