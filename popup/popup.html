<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yutu Labs - Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 8.64L15.27 12 10 15.36V8.64M8 5v14l11-7L8 5z"/>
        </svg>
        <h1>Yutu Labs</h1>
      </div>
      <p class="subtitle">Floating window settings</p>
    </header>

    <section class="speed-section">
      <h2>Playback Speed Control</h2>
      <p class="help-text">Change playback speed on the <strong>active YouTube tab</strong>.</p>

      <label class="speed-toggle-label">
        <input type="checkbox" id="close-on-finish" class="toggle-input">
        <span class="toggle-slider"></span>
        <div class="toggle-text">
          <span class="toggle-title">Close on finish</span>
          <span class="toggle-description">Automatically close floating window when video ends</span>
        </div>
      </label>

      <div class="speed-buttons">
        <button class="speed-btn" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
        <button class="speed-btn" data-speed="2">2x</button>
      </div>

      <div id="speed-status" class="speed-status"></div>
    </section>

    <section class="settings-section">
      <h2>Hide elements in window</h2>
      <p class="help-text">Settings only apply to <strong>floating windows</strong> (when clicking "Open"). Does not affect your normal YouTube view.</p>

      <div class="toggle-group">
        <label class="toggle-label toggle-label--master">
          <input type="checkbox" id="hide-all" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Hide all (default)</span>
            <span class="toggle-description">Enable all hide rules in popup window</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-reels" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Reels / Shorts</span>
            <span class="toggle-description">Hide short videos section</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-sidebar" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Related videos</span>
            <span class="toggle-description">Hide recommendations sidebar</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-description" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Description</span>
            <span class="toggle-description">Hide video description</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-header" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Header</span>
            <span class="toggle-description">Hide top navigation bar</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-actions" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Like/More actions</span>
            <span class="toggle-description">Hide like-dislike and more-actions buttons</span>
          </div>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="hide-merch-shelf" class="toggle-input">
          <span class="toggle-slider"></span>
          <div class="toggle-text">
            <span class="toggle-title">Merch shelf</span>
            <span class="toggle-description">Hide products/store section below video</span>
          </div>
        </label>
      </div>
    </section>

    <footer>
      <button id="save-btn" class="btn-primary">Save changes</button>
      <div id="save-status" class="save-status"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
